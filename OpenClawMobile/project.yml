name: OpenClawMobile
options:
  bundleIdPrefix: com.openclaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  OpenClawMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: OpenClaw
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyleForce: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # TLS enforced for public hosts; plaintext only for LAN/loopback dev
        # (eng review 2026-07-21, issue 2B — never ship ArbitraryLoads in a trust product)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: "Take a photo to send to your agent, or scan the QR setup code from your gateway."
        NSPhotoLibraryUsageDescription: "Attach photos and screenshots to messages for your agents."
        NSMicrophoneUsageDescription: "Dictate messages to your agents with the microphone."
        NSSpeechRecognitionUsageDescription: "Turn your dictation into message text. Recognition runs on this device when your language supports it; otherwise Apple's speech service processes the audio."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw.mobile
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
  OpenClawMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: OpenClawMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw.mobile.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenClawMobile.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OpenClawMobile"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OpenClawMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: OpenClawMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openclaw-gv.mobile.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: OpenClawMobile

schemes:
  OpenClawMobile:
    build:
      targets:
        OpenClawMobile: all
        OpenClawMobileTests: [test]
    test:
      targets:
        - OpenClawMobileTests

  # UI tests drive real taps (card drags, filter menu, Stop) that simctl cannot.
  # Separate scheme: they need a live sandbox gateway, so they must not gate the unit suite.
  OpenClawMobileUI:
    build:
      targets:
        OpenClawMobile: all
        OpenClawMobileUITests: [test]
    test:
      targets:
        - OpenClawMobileUITests
